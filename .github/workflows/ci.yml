name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  # Dogfood: run sentinelflow scan on itself
  dogfood:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run SentinelFlow scan on itself
        # Run the actual bundled bin entrypoint (dist/bundle.js), not the
        # unbundled tsc output (dist/index.js) — dogfooding the real
        # published artifact is the whole point: it's what would have
        # caught the better-sqlite3 eager-import crash before it shipped.
        run: node packages/cli/dist/bundle.js scan . --format json

  # Clean-room install: simulate a real end-user `npx sentinelflow` with
  # NO monorepo node_modules (and therefore no better-sqlite3) available.
  # This is the exact reproduction that caught the eager-import crash
  # where `sentinelflow scan` failed on any environment missing the
  # optional native dependency.
  clean-room-install:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack the CLI tarball
        run: |
          mkdir -p /tmp/sf-pack
          npm pack --pack-destination /tmp/sf-pack
        working-directory: packages/cli

      - name: Extract into a clean directory with no node_modules
        run: |
          mkdir -p /tmp/sf-cleanroom
          tar -xzf /tmp/sf-pack/*.tgz -C /tmp/sf-cleanroom --strip-components=1

      - name: Run scan with zero optional dependencies installed
        run: |
          cd /tmp/sf-cleanroom
          node dist/bundle.js --version
          node dist/bundle.js scan --help
